name: Build PS2Xbox.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pygame vgamepad pystray pillow pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name PS2Xbox
          --collect-all vgamepad
          --hidden-import pystray._win32
          ps2xbox.py

      - uses: actions/upload-artifact@v4
        with:
          name: PS2Xbox
          path: dist/PS2Xbox.exe

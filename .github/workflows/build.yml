name: Build PS2Xbox.exe

on:
  push:
    branches: [main]
    tags: ["v*"]   # pushing a tag like v1.0.0 also publishes a release
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          # vgamepad otherwise opens the ViGEmBus installer and waits forever.
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
        run: python -m pip install --upgrade pygame vgamepad pystray pillow pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name PS2Xbox
          --collect-all vgamepad
          --hidden-import pystray._win32
          ps2xbox.py

      - uses: actions/upload-artifact@v4
        with:
          name: PS2Xbox
          path: dist/PS2Xbox.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PS2Xbox.exe \
            --title "PS → Xbox $GITHUB_REF_NAME" \
            --notes "Download **PS2Xbox.exe** below and double-click it. First time? Install the ViGEmBus driver: https://github.com/nefarius/ViGEmBus/releases/latest (the app also offers to open that page)."

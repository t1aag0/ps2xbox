name: Build PS2Xbox.exe

on:
  push:
    branches: [main]
  release:
    types: [published]   # publishing a release on GitHub attaches the exe to it
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          # vgamepad otherwise opens the ViGEmBus installer and waits forever.
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
        run: python -m pip install --upgrade pygame vgamepad pystray pillow pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name PS2Xbox
          --collect-all vgamepad
          --hidden-import pystray._win32
          ps2xbox.py

      - uses: actions/upload-artifact@v4
        with:
          name: PS2Xbox
          path: dist/PS2Xbox.exe

      - name: Attach exe to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/PS2Xbox.exe --clobber
